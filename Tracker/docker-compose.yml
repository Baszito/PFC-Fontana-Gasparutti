name: test
services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - db:/data/db
  api:
    build: ./api
    ports:
      - 4000:4000
    depends_on: #para que arranque despues de mongo
      - mongo

  reparto:
    build: ./api #se arranca al mismo tiempo que la api
    ports:
      - 5000:5000
    command: node reparto.js
    depends_on:
      - mongo

  pagina:
    build: .
    ports: 
      - 3000:3000
    depends_on: 
      - api

  preprocesamiento:
    build: ./api #se arranca al mismo tiempo que la api
    ports:
      - 6000:6000
    command: node preprocesamiento.js
    depends_on:
      - mongo
      
volumes:
  db: